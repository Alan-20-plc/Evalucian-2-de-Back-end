<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Arriendo de Maquinaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white text-center">
                        <h4 class="mb-0">🚜 Iniciar Sesión</h4>
                    </div>
                    <div class="card-body">
                        <!-- El formulario envía los datos por POST a la ruta de validación -->
                        <form method="post">
                            {% csrf_token %} <!-- Token de seguridad obligatorio de Django -->
                            
                            {{ form.as_p }} <!-- Esto dibuja los campos de Usuario y Contraseña automáticamente -->
                            
                            <button type="submit" class="btn btn-primary w-100 mt-3">Entrar al Sistema</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
